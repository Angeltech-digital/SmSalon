<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign Up - SM BARBERSHOP SALON AND SPA Management</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .auth-card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .auth-card p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .btn-signup {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-signup:active {
            transform: translateY(0);
        }

        .btn-signup:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .success-message.show {
            display: block;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        .account-type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .account-type-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .account-type-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .account-type-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .requirement {
            display: flex;
            align-items: center;
            margin-top: 3px;
        }

        .requirement::before {
            content: "•";
            margin-right: 5px;
            color: #dc3545;
        }

        .requirement.met::before {
            color: #28a745;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
        <a href="index.html" class="back-button">← Back to Home</a>
            <h2>Create Account</h2>
            <p>Register for salon access</p>

            <!-- Account Type Selection -->
            <div class="account-type-selector" style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button type="button" class="account-type-btn active" data-type="customer" onclick="selectAccountType('customer')">
                    Customer
                </button>
                <button type="button" class="account-type-btn" data-type="admin" onclick="selectAccountType('admin')">
                    Staff/Admin
                </button>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="signupForm">
                <input type="hidden" id="accountType" value="customer">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Choose a username"
                        required
                        minlength="3"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input 
                            type="text" 
                            id="firstName" 
                            name="firstName" 
                            placeholder="First name"
                        >
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input 
                            type="text" 
                            id="lastName" 
                            name="lastName" 
                            placeholder="Last name"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter a strong password"
                        required
                        minlength="6"
                        onchange="checkPassword()"
                    >
                    <div class="password-requirements">
                        <div class="requirement" id="req-length">
                            At least 6 characters
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">Confirm Password</label>
                    <input 
                        type="password" 
                        id="passwordConfirm" 
                        name="passwordConfirm" 
                        placeholder="Confirm your password"
                        required
                        onchange="checkPassword()"
                    >
                </div>

                <button type="submit" class="btn-signup" id="signupBtn">
                    <span class="spinner" style="display: none;"></span>
                    <span id="signupBtnText">Create Customer Account</span>
                </button>
            </form>

            <div class="loading" id="loading">
                <span class="spinner"></span>
                Creating account...
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Use API_CONFIG from script.js instead of duplicate declaration
        const API_BASE_URL = API_CONFIG.BASE_URL;

        function selectAccountType(type) {
            document.getElementById('accountType').value = type;
            
            // Update button styles
            document.querySelectorAll('.account-type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.account-type-btn[data-type="${type}"]`).classList.add('active');
            
            // Update button text
            const btnText = document.getElementById('signupBtnText');
            if (type === 'admin') {
                btnText.textContent = 'Create Staff Account';
            } else {
                btnText.textContent = 'Create Customer Account';
            }
        }

        function checkPassword() {
            const password = document.getElementById('password').value;
            const reqLength = document.getElementById('req-length');

            if (password.length >= 6) {
                reqLength.classList.add('met');
            } else {
                reqLength.classList.remove('met');
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const accountType = document.getElementById('accountType').value;

            // Clear previous messages
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
            document.getElementById('errorMessage').textContent = '';
            document.getElementById('successMessage').textContent = '';

            // Validate
            if (!username || !email || !password || !passwordConfirm) {
                showError('Please fill in all required fields');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }

            if (password !== passwordConfirm) {
                showError('Passwords do not match');
                return;
            }

            const signupBtn = document.getElementById('signupBtn');
            const spinner = signupBtn.querySelector('.spinner');
            signupBtn.disabled = true;
            spinner.style.display = 'inline-block';
            document.getElementById('loading').classList.add('show');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/signup/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password,
                        password_confirm: passwordConfirm,
                        first_name: firstName,
                        last_name: lastName
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Sign up failed. Please try again.');
                    signupBtn.disabled = false;
                    spinner.style.display = 'none';
                    document.getElementById('loading').classList.remove('show');
                    return;
                }

                // Store tokens and user data
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                localStorage.setItem('user', JSON.stringify(data.user));

                // For admin accounts, set is_staff flag
                if (accountType === 'admin') {
                    // Update user to staff
                    await fetch(`${API_BASE_URL}/auth/profile/`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${data.access}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            first_name: firstName,
                            last_name: lastName,
                            email: email,
                            is_staff: true
                        })
                    });

                    const updatedUser = { ...data.user, is_staff: true, user_type: 'admin' };
                    localStorage.setItem('user', JSON.stringify(updatedUser));
                    localStorage.setItem('user_type', 'admin');
                    
                    showSuccess('Admin account created successfully! Redirecting to admin panel...');
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1500);
                } else {
                    localStorage.setItem('user_type', 'customer');
                    showSuccess('Account created successfully! Redirecting to your dashboard...');
                    setTimeout(() => {
                        window.location.href = 'customer-dashboard.html';
                    }, 1500);
                }

            } catch (error) {
                console.error('Error:', error);
                showError('Network error. Please try again.');
                signupBtn.disabled = false;
                spinner.style.display = 'none';
                document.getElementById('loading').classList.remove('show');
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            
            if (token) {
                if (user.user_type === 'admin' || user.is_staff) {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'customer-dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
